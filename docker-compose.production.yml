# PRODUÇÃO - Use este arquivo para deploy em nuvem
# docker-compose -f docker-compose.production.yml up -d

services:
  neo4j:
    image: neo4j:5.22
    container_name: evoluipc-neo4j
    restart: always
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?Error: NEO4J_PASSWORD not set}
      NEO4J_server_memory_heap_max__size: 2G
      NEO4J_dbms_memory_pagecache_size: 1G
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    networks:
      - evoluipc-network
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -a bolt://neo4j:7687 -u neo4j -p $NEO4J_PASSWORD \"RETURN 1\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  engine:
    build:
      context: ./evoluipc-engine
      dockerfile: Dockerfile
    container_name: evoluipc-engine
    restart: always
    depends_on:
      neo4j:
        condition: service_healthy
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:?Error: NEO4J_PASSWORD not set}
      NEO4J_DATABASE: neo4j
    networks:
      - evoluipc-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://engine:8002/api/recommendations/me', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 5

  django:
    build:
      context: ./django
      dockerfile: Dockerfile
    container_name: evoluipc-django
    restart: always
    depends_on:
      engine:
        condition: service_healthy
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Error: DJANGO_SECRET_KEY not set}
      DJANGO_DEBUG: "0"
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:?Error: DJANGO_ALLOWED_HOSTS not set}
      DJANGO_CORS_ALLOWED_ORIGINS: ${DJANGO_CORS_ALLOWED_ORIGINS:?Error: DJANGO_CORS_ALLOWED_ORIGINS not set}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:?Error: NEO4J_PASSWORD not set}
      NEO4J_DATABASE: neo4j
    command: sh -c "python manage.py seed_demo_users && gunicorn evoluipc_backend.wsgi:application --bind 0.0.0.0:8000 --workers 4"
    networks:
      - evoluipc-network
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://django:8000/api/auth/me', timeout=5)",
        ]
      interval: 30s
      timeout: 10s
      retries: 5

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: evoluipc-frontend
    restart: always
    depends_on:
      django:
        condition: service_started
      engine:
        condition: service_started
    environment:
      VITE_API_BASE: ${VITE_API_BASE:?Error: VITE_API_BASE not set}
      VITE_ENGINE_API_BASE: ${VITE_ENGINE_API_BASE:?Error: VITE_ENGINE_API_BASE not set}
    networks:
      - evoluipc-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4173', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 5

networks:
  evoluipc-network:
    driver: bridge

volumes:
  neo4j_data:
    driver: local
  neo4j_logs:
    driver: local
